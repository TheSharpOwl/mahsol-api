services:
  db:
    image: mysql:8.0
    container_name: farming_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farming_db}
      MYSQL_USER: ${MYSQL_USER:-farmer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-farmer}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: farming_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: farming_api
    restart: always
    volumes:
      - ./data:/soil-data:ro
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HWSD_MDB_PATH=${HWSD_MDB_PATH:-HWSD2.mdb}
      - HWSD_RASTER_PATH=${HWSD_RASTER_PATH:-HWSD2.bil}
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  celery_worker:
    build: .
    container_name: farming_celery_worker
    restart: always
    volumes:
      - ./data:/soil-data:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HWSD_MDB_PATH=${HWSD_MDB_PATH:-HWSD2.mdb}
      - HWSD_RASTER_PATH=${HWSD_RASTER_PATH:-HWSD2.bil}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery.celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    build: .
    container_name: farming_celery_beat
    restart: always
    volumes:
      - ./data:/soil-data:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HWSD_MDB_PATH=${HWSD_MDB_PATH:-HWSD2.mdb}
      - HWSD_RASTER_PATH=${HWSD_RASTER_PATH:-HWSD2.bil}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery.celery_app beat --loglevel=info

  flower:
    build: .
    container_name: farming_flower
    restart: always
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - redis
      - celery_worker
    command: celery -A app.workers.celery.celery_app flower --port=5555

  adminer:
    image: adminer
    container_name: farming_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data:
