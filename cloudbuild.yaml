steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '-f'
      - 'Dockerfile'
      - '.'                      # build context = repo root (/workspace)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: 'gcr.io/$PROJECT_ID/mahsol-api:$SHORT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
